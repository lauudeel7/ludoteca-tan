<div class="container">
  <h1>{{ id() ? 'Modificar préstamo' : 'Nuevo préstamo' }}</h1>

  <form #loanForm="ngForm">
    <mat-form-field appearance="outline">
      <mat-label>Identificador</mat-label>
      <input matInput [value]="id() ?? ''" readonly>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cliente *</mat-label>
      <mat-select [ngModel]="clientId()" (ngModelChange)="clientId.set($event)" name="client" required>
        @for (c of clients(); track c.id) {
          <mat-option [value]="c.id">{{ c.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Juego *</mat-label>
      <mat-select [ngModel]="gameId()" (ngModelChange)="gameId.set($event)" name="game" required>
        @for (g of games(); track g.id) {
          <mat-option [value]="g.id">{{ g.title }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rango de fechas *</mat-label>
      <mat-date-range-input [rangePicker]="rangePicker" required>
        <input matInput matStartDate [ngModel]="startDate()" (ngModelChange)="startDate.set($event)" name="start" required placeholder="Inicio">
        <input matInput matEndDate [ngModel]="endDate()" (ngModelChange)="endDate.set($event)" name="end" required placeholder="Fin">
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
      <mat-date-range-picker #rangePicker></mat-date-range-picker>
    </mat-form-field>

    @if (errorMessage()) {
    <div class="alert-error-msg" style="margin-bottom: 16px;">
      {{ errorMessage() }}
    </div>
  }

  </form>

  <div class="buttons">
    <button mat-stroked-button (click)="onClose()">Cerrar</button>
    <button mat-flat-button color="primary" (click)="onSave()" [disabled]="!isValid() || loanForm.invalid">Guardar</button>
  </div>
</div>
